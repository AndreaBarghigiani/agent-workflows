# Consumer routing input: setup writes .agents/memory/config.toml
schema_version = 2

[project]
id = "example-app"

[memory]
write_project = "example-app"
search_projects = ["example-app", "shared-engineering"]
related_projects = ["example-api", "example-editor"]
mcp_server = "basic_memory"
# Each client must connect this server name to the same Basic Memory service.
# No filesystem mount. Choose each client's locally configured server name.
