name: Validate workflows
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test
      - run: node scripts/validate.ts
